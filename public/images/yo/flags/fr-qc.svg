<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" preserveAspectRatio="xMidYMid meet" role="img" aria-hidden="true" focusable="false">
  <title>Drapeau du Québec  fleurdelisé</title>
  <!--
    Quebec fleurdelisé. Blue field, white cross, four white
    fleurs-de-lis (one per quadrant, all pointing up).
    Geometry is simplified for a 60x40 badge: cross thickness
    is 4 units (H 1/10 of length, faithful to the official
    1/13 spirit), and the fleur-de-lis is a single compact
    path so it reads at h-10 sizes without going muddy.
  -->
  <rect width="60" height="40" fill="#003DA5"/>
  <path d="M28 0 H32 V40 H28 Z M0 18 H60 V22 H0 Z" fill="#FFFFFF"/>
  <symbol id="yoflag-fleur" viewBox="-10 -10 20 20">
    <path
      fill="#FFFFFF"
      d="M0 -8 C -2 -5 -2 -2 -0.6 -0.6 C -3 -1.4 -6 -0.4 -6 1.6 C -6 3.4 -4 4.4 -1.4 3.4 L -1.4 5 L -5 5 L -5 6.4 L 5 6.4 L 5 5 L 1.4 5 L 1.4 3.4 C 4 4.4 6 3.4 6 1.6 C 6 -0.4 3 -1.4 0.6 -0.6 C 2 -2 2 -5 0 -8 Z M -3 7 H 3 L 0 9.4 Z"
    />
  </symbol>
  <use href="#yoflag-fleur" x="4" y="2" width="20" height="14"/>
  <use href="#yoflag-fleur" x="36" y="2" width="20" height="14"/>
  <use href="#yoflag-fleur" x="4" y="24" width="20" height="14"/>
  <use href="#yoflag-fleur" x="36" y="24" width="20" height="14"/>
</svg>
