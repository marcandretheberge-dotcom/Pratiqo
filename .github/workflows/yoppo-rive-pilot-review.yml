name: Yoppo Rive pilot review

on:
  push:
    branches: [feat/yoppo-rive-pilot-20261110]
    paths:
      - "docs/yopratiqo/YOPPO_RIVE_RIG_V1.md"
      - "lib/companion/yoppoRigContract.ts"
      - "scripts/audit-yoppo-master.mjs"
      - "tests/companion/yoppoRigContract.test.ts"
      - "rive/yoppo-eye-spike/**"
      - ".github/workflows/yoppo-rive-pilot-review.yml"

permissions:
  contents: read

concurrency:
  group: yoppo-rive-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rig-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Canonical PNG audit
        run: node scripts/audit-yoppo-master.mjs
      - name: TypeScript contract
        run: npx tsc --noEmit
      - name: Rig parent and pivot contract
        run: node --import tsx tests/companion/yoppoRigContract.test.ts
      - name: Install current Rive CLI for capability spike
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://releases.rive.app/cli/install.sh | bash
          echo "$HOME/.rive/bin" >> "$GITHUB_PATH"
      - name: Probe Rive rigging schemas before drawing
        shell: bash
        run: |
          set -euo pipefail
          rive --version
          rive doctor
          for term in clipping bone ik mesh vertex keyframe; do
            echo "===== schema search: $term ====="
            rive schema --search "$term" || true
          done
          for term in clipping rigging mesh bone constraint animation keyframe; do
            echo "===== docs search: $term ====="
            rive docs --search "$term" || true
          done
      - name: Focused lint
        run: npx eslint lib/companion/yoppoRigContract.ts scripts/audit-yoppo-master.mjs tests/companion/yoppoRigContract.test.ts
      - name: Diff integrity
        run: git diff --check origin/main...HEAD
