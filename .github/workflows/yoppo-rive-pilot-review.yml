name: Yoppo Rive pilot review

on:
  push:
    branches: [feat/yoppo-rive-pilot-20261110]
    paths:
      - "docs/yopratiqo/YOPPO_RIVE_RIG_V1.md"
      - "lib/companion/yoppoRigContract.ts"
      - "scripts/audit-yoppo-master.mjs"
      - "scripts/measure-yoppo-geometry.mjs"
      - "scripts/*yoppo*"
      - "tests/companion/yoppo*"
      - ".gitattributes"
      - "tests/companion/yoppoRigContract.test.ts"
      - "tests/companion/yoppoGeometryDiagnostics.test.mjs"
      - "rive/yoppo-eye-spike/**"
      - "rive/yoppo-master/**"
      - "rive/yoppo-transparency-probe/**"
      - "scripts/compare-yoppo-master.ts"
      - ".github/workflows/yoppo-rive-pilot-review.yml"

permissions:
  contents: read

concurrency:
  group: yoppo-rive-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rig-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript contract
        run: npx tsc --noEmit
      - name: Rig parent and pivot contract
        run: node --import tsx tests/companion/yoppoRigContract.test.ts
      - name: Measurement failure diagnostics regression
        run: node tests/companion/yoppoGeometryDiagnostics.test.mjs
      - name: Independent reference and unchanged thresholds
        run: node --import tsx tests/companion/yoppoApprovedReference.test.ts
      - name: Strict iteration keep and revert rules
        run: node tests/companion/yoppoIterationPolicy.test.mjs
      - name: Fail closed on opaque or empty captures
        run: node --import tsx tests/companion/yoppoCaptureAlpha.test.ts
      - name: Diagnostic ownership palette cannot alias another part
        run: node tests/companion/yoppoLabelPalette.test.mjs
      - name: Linux dependency preparation fails closed
        run: python3 -B tests/companion/yoppoLinuxRuntime.test.py
      - name: Focused lint
        run: npx eslint lib/companion/yoppoRigContract.ts scripts/*yoppo*.mjs scripts/*yoppo*.ts tests/companion/yoppo*.mjs tests/companion/yoppo*.ts
      - name: Diff integrity
        run: git diff --check origin/main...HEAD
      - name: Canonical PNG audit
        run: node scripts/audit-yoppo-master.mjs
      - name: Canonical geometry measurement
        run: node scripts/measure-yoppo-geometry.mjs /tmp/yoppo-canonical-geometry.json /tmp/yoppo-canonical-geometry-annotated.png
      - name: Upload canonical diagnostics even when measurement is blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoppo-canonical-measurement
          path: |
            /tmp/yoppo-canonical-geometry.json
            /tmp/yoppo-canonical-geometry-annotated.png
          retention-days: 7
          if-no-files-found: warn
      - name: Require a measurement freeze before rendering
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-yoppo-freeze.mjs
      - name: Verify or install Linux graphics runtime for Rive CLI
        run: python3 -B scripts/ensure-yoppo-linux-runtime.py
      - name: Install pinned Rive CLI 1.9.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://releases.rive.app/cli/v1.9.2/rive-linux-x64.tar.gz -o "$RUNNER_TEMP/rive-1.9.2.tar.gz"
          echo "e606530230ad8ddc4869d1ade4de10c5ffb3e74e44745339c227018e65eabb0b  $RUNNER_TEMP/rive-1.9.2.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/rive-1.9.2"
          tar -xzf "$RUNNER_TEMP/rive-1.9.2.tar.gz" -C "$RUNNER_TEMP/rive-1.9.2" -- rive docs
          echo "$RUNNER_TEMP/rive-1.9.2" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/rive-1.9.2/rive" analytics off
          test "$("$RUNNER_TEMP/rive-1.9.2/rive" --version)" = "rive 1.9.2"
      - name: Require genuinely transparent Rive capture
        shell: bash
        run: |
          set -euo pipefail
          rive rive/yoppo-transparency-probe --screenshot=/tmp/yoppo-transparency-probe.png --advance=0
          node --import tsx scripts/check-yoppo-capture.ts /tmp/yoppo-transparency-probe.png /tmp/yoppo-transparency-probe.json
      - name: Upload transparency preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoppo-transparency-preflight
          path: |
            /tmp/yoppo-transparency-probe.png
            /tmp/yoppo-transparency-probe.json
          if-no-files-found: warn
          retention-days: 7
      - name: Verify neutral-master RML without rendering
        run: rive rive/yoppo-master --verify
      - name: Scaffold current Rive project template
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/yoppo-rive-template
          rive create /tmp/yoppo-rive-template
          echo "===== scaffold files ====="
          find /tmp/yoppo-rive-template -maxdepth 3 -type f -print | sort
          echo "===== rive.yaml ====="
          cat /tmp/yoppo-rive-template/rive.yaml
          echo "===== RML files ====="
          while IFS= read -r file; do
            echo "----- $file -----"
            sed -n '1,220p' "$file"
          done < <(find /tmp/yoppo-rive-template -type f \( -name '*.rml' -o -name '*.rml.xml' \) | sort)
      - name: Probe Rive rigging schemas before drawing
        shell: bash
        run: |
          set -euo pipefail
          rive --version
          rive doctor
          for term in clipping bone ik mesh vertex keyframe; do
            echo "===== schema search: $term ====="
            rive schema --search "$term" || true
          done
          for type in ClippingShape PointsPath StraightVertex CubicAsymmetricVertex RootBone Bone IKConstraint Skin Tendon Weight Mesh MeshVertex; do
            echo "===== schema: $type ====="
            rive schema "$type" || true
            echo "===== animatable: $type ====="
            rive schema "$type" --animatable || true
          done
          echo "===== drawing clipping excerpt ====="
          rive docs drawing | sed -n '300,345p'
          echo "===== rigging path/skin excerpt ====="
          rive docs rigging | sed -n '110,210p'
          echo "===== rigging animation excerpt ====="
          rive docs rigging | sed -n '340,410p'
          for term in clipping rigging mesh bone constraint animation keyframe; do
            echo "===== docs search: $term ====="
            rive docs --search "$term" || true
          done
      - name: Verify and render Yoppo eye tooling spike
        id: eye-spike
        shell: bash
        run: |
          set -euo pipefail
          rive rive/yoppo-eye-spike --verify

          rive inspect rive/yoppo-eye-spike --json > /tmp/yoppo-eye-inspect.json
          cat /tmp/yoppo-eye-inspect.json

          rive rive/yoppo-eye-spike --screenshot=/tmp/yoppo-eye-frame-0.png --advance=0
          rive rive/yoppo-eye-spike --screenshot=/tmp/yoppo-eye-frame-30.png --advance=30

          test -s /tmp/yoppo-eye-frame-0.png
          test -s /tmp/yoppo-eye-frame-30.png

          node - <<'NODE'
          const fs = require("fs");
          const sharp = require("sharp");

          async function main() {
            const text = fs.readFileSync("/tmp/yoppo-eye-inspect.json", "utf8");
            const json = JSON.parse(text);
            const serialized = JSON.stringify(json);
            for (const required of ["Eye White", "Pupil", "Upper Lid", "ClippingShape", "Motion Control", "Upper", "Fore", "Two Bone IK", "Skinned Ribbon"]) {
              if (!serialized.includes(required)) throw new Error("inspect output missing " + required);
            }
            const problems = JSON.stringify(json.problems ?? []);
            if (problems !== "[]" && problems !== "{}" && problems !== "null") {
              throw new Error("Rive inspect reported problems: " + problems);
            }

            async function pixels(path) {
              const { data, info } = await sharp(path).ensureAlpha().raw().toBuffer({ resolveWithObject: true });
              return { data, info };
            }
            const a = await pixels("/tmp/yoppo-eye-frame-0.png");
            const b = await pixels("/tmp/yoppo-eye-frame-30.png");
            if (a.info.width !== b.info.width || a.info.height !== b.info.height) throw new Error("screenshot sizes differ");

            let eyeTeal0 = 0, eyeTeal30 = 0, eyeChanged = 0, controlChanged = 0;
            const width = a.info.width;
            for (let y = 55; y < Math.min(185, a.info.height); y++) {
              for (let x = 105; x < Math.min(295, width); x++) {
                const i = (y * width + x) * 4;
                const ar=a.data[i], ag=a.data[i+1], ab=a.data[i+2];
                const br=b.data[i], bg=b.data[i+1], bb=b.data[i+2];
                if (ag > ar + 28 && ab > ar + 24 && ag < 180) eyeTeal0++;
                if (bg > br + 28 && bb > br + 24 && bg < 180) eyeTeal30++;
                if (Math.abs(ar-br)+Math.abs(ag-bg)+Math.abs(ab-bb) > 24) eyeChanged++;
              }
            }
            for (let y = 25; y < Math.min(75, a.info.height); y++) {
              for (let x = 305; x < Math.min(390, width); x++) {
                const i = (y * width + x) * 4;
                const diff = Math.abs(a.data[i]-b.data[i])+Math.abs(a.data[i+1]-b.data[i+1])+Math.abs(a.data[i+2]-b.data[i+2]);
                if (diff > 24) controlChanged++;
              }
            }
            if (controlChanged < 100) throw new Error("headless --advance did not move control: " + controlChanged);
            if (eyeTeal0 < 350) throw new Error("frame 0 eye has no visible clipped teal pupil: " + eyeTeal0);
            if (eyeChanged < 450) throw new Error("frame 30 eye does not visibly differ from frame 0: " + eyeChanged);
            // Translation can preserve pupil area; changed-pixel count is the correct motion oracle.
            console.log(JSON.stringify({ eyeTeal0, eyeTeal30, eyeChanged, controlChanged }));
          }
          main().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Upload Yoppo eye spike evidence
        if: always() && steps.eye-spike.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: yoppo-eye-rive-spike
          path: |
            /tmp/yoppo-eye-frame-0.png
            /tmp/yoppo-eye-frame-30.png
            /tmp/yoppo-eye-inspect.json
            rive/yoppo-eye-spike/build/problems.log
          if-no-files-found: error
          retention-days: 7
      - name: Verify and render Yoppo neutral master
        shell: bash
        run: |
          set -euo pipefail
          export RIVE_CLI="$(command -v rive)"
          export PYTHON_EXECUTABLE="$(command -v python3)"
          node scripts/render-yoppo-pilot.mjs ci-candidate baseline
      - name: Upload Yoppo neutral master evidence
        if: always() && hashFiles('rive/yoppo-master/evidence/freeze-manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: yoppo-neutral-master-v1
          path: |
            .qa-guided/yoppo-pilot/renders/ci-candidate/
            rive/yoppo-master/evidence/freeze-manifest.json
            rive/yoppo-master/evidence/render-attempts.jsonl
            rive/yoppo-master/evidence/iterations.jsonl
            rive/yoppo-master/build/problems.log
          if-no-files-found: error
          retention-days: 7
