name: Yoppo Rive pilot review

on:
  push:
    branches: [feat/yoppo-rive-pilot-20261110]
    paths:
      - "docs/yopratiqo/YOPPO_RIVE_RIG_V1.md"
      - "lib/companion/yoppoRigContract.ts"
      - "scripts/audit-yoppo-master.mjs"
      - "tests/companion/yoppoRigContract.test.ts"
      - "rive/yoppo-eye-spike/**"
      - ".github/workflows/yoppo-rive-pilot-review.yml"

permissions:
  contents: read

concurrency:
  group: yoppo-rive-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rig-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Canonical PNG audit
        run: node scripts/audit-yoppo-master.mjs
      - name: TypeScript contract
        run: npx tsc --noEmit
      - name: Rig parent and pivot contract
        run: node --import tsx tests/companion/yoppoRigContract.test.ts
      - name: Install Linux graphics runtime for Rive CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y libegl1 libgl1 libgles2 libx11-6 libxext6 libxrender1 libxi6 libxrandr2 libxcursor1 libxinerama1 libxkbcommon0
      - name: Install current Rive CLI for capability spike
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://releases.rive.app/cli/install.sh | bash
          echo "$HOME/.rive/bin" >> "$GITHUB_PATH"
      - name: Scaffold current Rive project template
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/yoppo-rive-template
          rive create /tmp/yoppo-rive-template
          echo "===== scaffold files ====="
          find /tmp/yoppo-rive-template -maxdepth 3 -type f -print | sort
          echo "===== rive.yaml ====="
          cat /tmp/yoppo-rive-template/rive.yaml
          echo "===== RML files ====="
          while IFS= read -r file; do
            echo "----- $file -----"
            sed -n '1,220p' "$file"
          done < <(find /tmp/yoppo-rive-template -type f \( -name '*.rml' -o -name '*.rml.xml' \) | sort)
      - name: Probe Rive rigging schemas before drawing
        shell: bash
        run: |
          set -euo pipefail
          rive --version
          rive doctor
          for term in clipping bone ik mesh vertex keyframe; do
            echo "===== schema search: $term ====="
            rive schema --search "$term" || true
          done
          for type in ClippingShape PointsPath StraightVertex CubicAsymmetricVertex RootBone Bone IKConstraint Skin Tendon Weight Mesh MeshVertex; do
            echo "===== schema: $type ====="
            rive schema "$type" || true
            echo "===== animatable: $type ====="
            rive schema "$type" --animatable || true
          done
          echo "===== drawing clipping excerpt ====="
          rive docs drawing | sed -n '300,345p'
          echo "===== rigging path/skin excerpt ====="
          rive docs rigging | sed -n '110,210p'
          echo "===== rigging animation excerpt ====="
          rive docs rigging | sed -n '340,410p'
          for term in clipping rigging mesh bone constraint animation keyframe; do
            echo "===== docs search: $term ====="
            rive docs --search "$term" || true
          done
      - name: Focused lint
        run: npx eslint lib/companion/yoppoRigContract.ts scripts/audit-yoppo-master.mjs tests/companion/yoppoRigContract.test.ts
      - name: Diff integrity
        run: git diff --check origin/main...HEAD
