name: Yo guided Italian review
on:
  push:
    branches: [feat/yo-guided-italian-20261106]
permissions:
  contents: read
concurrency:
  group: yo-guided-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      YO_QA_DIR: /tmp/yo-guided-qa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full repository TypeScript
        run: npx tsc --noEmit
      - name: Guided course tests and targeted lint
        run: |
          node --import tsx tests/yo/yopratiqoGuidedItalian.test.ts
          node --import tsx tests/yo/yopratiqoGuidedItalianPlayer.test.tsx
          npx eslint components/yo/italian/guided lib/yo/italian/course/guidedItalian.ts app/yo/langues/italien/parcours/page.tsx 'app/yo/langues/italien/parcours/[unitId]/page.tsx'
      - name: Course and launch regressions
        run: |
          npm run test:yo-italian-course
          npm run test:yo-italian-pilot
          npm run test:yo-continuity
          npm run test:yo-journey
          npm run test:launch-critical
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Actual component browser walkthrough
        run: |
          node --import tsx scripts/prepare_yo_guided_review.ts
          ./node_modules/.bin/next dev .qa-guided --webpack -p 3129 > "$YO_QA_DIR/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3129/?lang=en >/dev/null; then break; fi
            sleep 2
          done
          python tests/yo/yopratiqoGuidedItalian.browser.py | tee "$YO_QA_DIR/browser.log"
      - name: Record reviewed source hashes
        if: always()
        run: |
          mkdir -p "$YO_QA_DIR"
          git ls-files -s components/yo/italian/guided lib/yo/italian/course/guidedItalian.ts app/yo/langues/italien/parcours tests/yo/yopratiqoGuidedItalian* > "$YO_QA_DIR/source-hashes.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yo-guided-review
          path: /tmp/yo-guided-qa
          retention-days: 7
