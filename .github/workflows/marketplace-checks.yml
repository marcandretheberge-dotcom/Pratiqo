name: Marketplace checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: marketplace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Marketplace verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:auth
      - run: npm run test:payments
      - run: npm run test:security
      - run: node --import tsx tests/marketing/publicBookingFunnel.test.ts
