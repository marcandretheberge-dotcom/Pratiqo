name: Yo shared source
on:
  push:
    branches: [feat/yo-shared-language-start-20261107]
    paths: [.github/workflows/yo-shared-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD | gzip > /tmp/yo-shared-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: yo-shared-source
          path: /tmp/yo-shared-source.tar.gz
          retention-days: 1
