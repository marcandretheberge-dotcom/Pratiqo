name: Yo tap flow live verification
on:
  push:
    branches: [qa/yo-tap-live-20261108]
    paths: [.github/workflows/yo-tap-live.yml]
permissions:
  contents: read
jobs:
  live:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        language: [anglais, francais-quebec, espagnol, allemand, portugais-bresil, japonais, mandarin, italien]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      YO_LANGUAGE: ${{ matrix.language }}
      YO_TAP_URL: https://pratiqo-6nv0fau5i-marcandretheberge-dotcoms-projects.vercel.app
      YO_TAP_FIXTURES: '0'
      YO_QA_DIR: /tmp/yo-tap-live
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b560c6015ed1d0e04c39aeed5cf0d2bb6b26b7a4
          persist-credentials: false
      - name: Exact product identity
        run: |
          test "$(git rev-parse HEAD)" = b560c6015ed1d0e04c39aeed5cf0d2bb6b26b7a4
          mkdir -p "$YO_QA_DIR"
          git rev-parse HEAD > "$YO_QA_DIR/commit.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit > "$YO_QA_DIR/browser-install.log" 2>&1 || { tail -n 100 "$YO_QA_DIR/browser-install.log"; exit 1; }
      - name: Actual preview, no accounts or media fixtures
        shell: bash
        run: |
          set -euo pipefail
          python -u tests/yo/yopratiqoTapFlow.browser.py 2>&1 | tee "$YO_QA_DIR/live.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yo-tap-live-${{ matrix.language }}-${{ github.run_attempt }}
          path: /tmp/yo-tap-live
          retention-days: 7
