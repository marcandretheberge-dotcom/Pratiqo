name: Yo guided source review
on:
  push:
    branches: [feat/yo-guided-italian-20261106]
    paths: [.github/workflows/yo-guided-source-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package locked dependencies only, no credentials or environment
        run: tar czf /tmp/pratiqo-guided-deps.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: pratiqo-guided-deps
          path: /tmp/pratiqo-guided-deps.tar.gz
          compression-level: 0
          retention-days: 1
