name: Learning project PostgreSQL
on:
  pull_request:
    paths:
      - 'supabase/migrations/135_student_learning_projects.sql'
      - 'supabase/migrations/136_learning_project_save_and_directory.sql'
      - 'tests/students/learningProjectQuotaPostgres.cjs'
      - 'tests/students/fixtures/learning-project-schema.json'
      - '.github/workflows/learning-project-postgres.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Restore affected schema and verify concurrent quota
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: node tests/students/learningProjectQuotaPostgres.cjs
