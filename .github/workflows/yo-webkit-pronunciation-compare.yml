name: Yo WebKit production vs preview pronunciation
on:
  push:
    branches: [qa/yo-sound-live-20261108]
    paths: [.github/workflows/yo-webkit-pronunciation-compare.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        target: [production, preview]
    env:
      YO_PROBE_URL: ${{ matrix.target == 'production' && 'https://www.pratiqo.ca' || 'https://pratiqo-g9p8vv4ag-marcandretheberge-dotcoms-projects.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit > /tmp/install-yo.log 2>&1
      - run: python -u tests/yo/yopratiqoWebKitPronunciationState.browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yo-audio-state-${{ matrix.target }}
          path: /tmp/yo-webkit-state
          retention-days: 3
