name: Yo verified XP and rankings

on:
  pull_request:
    paths:
      - ".github/workflows/yo-rankings.yml"
      - "app/api/yo/rankings/**"
      - "app/yo/classement/**"
      - "components/yo/**"
      - "lib/yo/**"
      - "supabase/migrations/*yo_real_xp_rankings*"
      - "tests/yo/yopratiqoRanking*"
      - "tests/yo/yopratiqoItalianGames.test.ts"
      - "tests/yo/yopratiqoGuidedItalianPlayer.test.tsx"
      - "tools/yo-rankings-review/**"
      - "package*.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:yo-rankings
      - run: npx tsc --noEmit --incremental false
      - run: npx playwright install --with-deps chromium
      - run: node tools/yo-rankings-review/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yo-rankings-browser-review
          path: .artifacts/yo-rankings
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
