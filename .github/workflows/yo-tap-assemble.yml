name: Assemble reviewed tap-flow objects
on:
  push:
    branches: [feat/yo-tap-flow-20261108]
    paths: [.github/workflows/yo-tap-assemble.yml]
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Reconstruct exact reviewed files and verify tree, without updating any ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='marcandretheberge-dotcom/Pratiqo'
          assert os.environ['GITHUB_REF']=='refs/heads/feat/yo-tap-flow-20261108'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='351b4cd04be3a041670b6ed1859317a90e76e52f'
          expected={'components/yo/italian/guided/GuidedItalianCourse.tsx','components/yo/italian/guided/copy.ts','scripts/prepare_yo_shared_review.ts','tests/yo/yopratiqoApprovedArtwork.test.tsx','tests/yo/yopratiqoFeedback.test.tsx','tests/yo/yopratiqoGuidedItalianPlayer.test.tsx','tests/yo/yopratiqoPersonalizedItalianPlayer.test.tsx','tests/yo/yopratiqoSharedIntro.test.ts','tests/yo/yopratiqoSharedIntroPlayer.test.tsx'}
          edits=json.loads(pathlib.Path('.github/yo-tap-reviewed-edits.json').read_text())
          assert {e['path'] for e in edits}==expected and len(edits)==len(expected)
          def api(path,data=None):
            req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/'+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          elements=[]
          for e in edits:
            text=pathlib.Path(e['path']).read_text()
            assert hashlib.sha256(text.encode()).hexdigest()==e['old'],e['path']+' base mismatch'
            for start,end,insert in reversed(e['edits']):text=text[:start]+insert+text[end:]
            assert hashlib.sha256(text.encode()).hexdigest()==e['new'],e['path']+' reconstruction mismatch'
            sha=api('git/blobs',{'content':text,'encoding':'utf-8'})['sha']
            elements.append({'path':e['path'],'mode':'100644','type':'blob','sha':sha})
            print(e['path'],sha)
          # The prepared tree includes only reviewed product/tests/docs, no assembly helpers.
          tree=api('git/trees',{'base_tree':'3cf39ba7f0655cfcbf95cecc52827d093592acd2','tree':elements})['sha']
          report={'tree':tree,'expectedTree':'c0ac643784f47e67a148566e4a5dbb22bd66a72c','files':elements}
          pathlib.Path('/tmp/yo-assembly-report.json').write_text(json.dumps(report,indent=2))
          if tree!=report['expectedTree']:
            pathlib.Path('/tmp/yo-assembly-tree.json').write_text(json.dumps(api('git/trees/'+tree+'?recursive=1')))
          assert tree==report['expectedTree'],'Candidate tree differs from locally tested source; no commit/ref was written'
          print('VERIFIED EXACT TREE',tree,'No branch, main or deployment changed by this job.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yo-tap-assembly
          path: /tmp/yo-assembly-*.json
          retention-days: 1
