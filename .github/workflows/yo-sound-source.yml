name: Yo sound source
on:
  push:
    branches: [feat/yo-sound-audio-review-20261108]
    paths: [.github/workflows/yo-sound-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD | gzip > /tmp/yo-sound-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: yo-sound-source
          path: /tmp/yo-sound-source.tar.gz
          retention-days: 1
