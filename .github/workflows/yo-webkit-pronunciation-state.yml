name: Yo isolated WebKit pronunciation state
on:
  push:
    branches: [qa/yo-sound-live-20261108]
    paths: [.github/workflows/yo-webkit-pronunciation-state.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit > /tmp/install-yo.log 2>&1
      - run: python -u tests/yo/yopratiqoWebKitPronunciationState.browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yo-webkit-pronunciation-state
          path: /tmp/yo-webkit-state
          retention-days: 3
