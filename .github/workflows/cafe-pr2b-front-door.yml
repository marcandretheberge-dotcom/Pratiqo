name: Cafe PR2b front door

on:
  pull_request:
    paths:
      - "app/cafe/**"
      - "components/cafe/**"
      - "lib/cafe/copy.ts"
      - "lib/cafe/publicTypes.ts"
      - "lib/cafe/heroMedia.ts"
      - "lib/cafe/sessionInput.ts"
      - "tests/cafe/cafePr2bFrontDoor.test.ts"
      - "tests/cafe/cafeFrontDoorLoading.test.tsx"
      - "tests/cafe/cafeHeroMedia.test.tsx"
      - "public/videos/cafe-world-journey.mp4"
      - ".github/workflows/cafe-pr2b-front-door.yml"
      - "package.json"

permissions:
  contents: read

jobs:
  cafe-front-door:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Cafe front-door contract
        run: npm run test:cafe-pr2b
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Focused lint
        run: npx eslint app/cafe/page.tsx app/cafe/CafeFrontDoor.tsx app/cafe/[slug]/page.tsx app/cafe/[slug]/CafeSessionDetails.tsx components/cafe/CafeSessionCard.tsx components/cafe/CafeHeroMedia.tsx lib/cafe/copy.ts lib/cafe/publicTypes.ts lib/cafe/heroMedia.ts tests/cafe/cafeFrontDoorLoading.test.tsx tests/cafe/cafeHeroMedia.test.tsx
      - name: Whitespace check
        run: git diff --check
