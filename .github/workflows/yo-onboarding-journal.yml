name: Yoppo onboarding motion
on:
  pull_request:
    paths:
      - 'app/yo/langues/layout.tsx'
      - 'components/yo/onboarding/**'
      - 'components/yo/personalized/ItalianOnboarding.tsx'
      - 'components/yo/personalized/ItalianLearningEntry.tsx'
      - 'components/yo/shared/IntroWelcome.tsx'
      - 'components/yo/shared/SharedIntro.tsx'
      - 'public/companion/travel/journal/**'
      - 'tests/yo/yopratiqoJournal.browser.py'
      - '.github/workflows/yo-onboarding-journal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://audio.example.test
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-ui-test
      YO_JOURNAL_QA_DIR: /tmp/yoppo-journal-qa
      YO_JOURNAL_VIDEO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Open the Italian and shared introductions in Chromium and WebKit
        run: |
          set -eu
          mkdir -p "$YO_JOURNAL_QA_DIR"
          ./node_modules/.bin/next dev --webpack --hostname 127.0.0.1 --port 3246 > "$YO_JOURNAL_QA_DIR/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          curl --retry 30 --retry-connrefused --retry-delay 1 -fsS -o /dev/null http://127.0.0.1:3246/companion/travel/journal/yoppo-journal.webp
          python tests/yo/yopratiqoJournal.browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-browser-evidence
          path: /tmp/yoppo-journal-qa
          retention-days: 7
