name: Yo recording repair candidate
on:
  push:
    branches: [feat/yo-sound-audio-review-20261108]
    paths: [.github/workflows/yo-audio-repair.yml]
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reuse two exact public source recordings, no synthesis or storage writes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/yo-repair
          cd /tmp/yo-repair
          python - <<'PY'
          import hashlib,json,urllib.request
          base='https://jwlbwmxoradmbuvqfkhe.supabase.co/storage/v1/object/public/yopratiqo-audio/yo/fr/fr-quebec-workplace-survival-1/comprendre-consignes-simples/quebec-french/phrase/'
          sources={'tiens':'4e4d6613b171ecc4a3d7c3670ea4f380e7bc70e2f2de7a296a228f0fb31b3992','tenez':'68406e88f8b20b849b1baa9bdf53075a4d11ac1d2116022d340ad2407580f4ba'}
          for word,expected in sources.items():
            data=urllib.request.urlopen(base+word+'.mp3',timeout=20).read(1000000)
            assert hashlib.sha256(data).hexdigest()==expected,word
            open(word+'.mp3','wb').write(data)
          json.dump({'sourceBase':base,'sources':sources,'method':'Existing Tiens. + 250 ms silence + existing Tenez.; no new TTS'},open('provenance.json','w'),indent=2)
          PY
          ffmpeg -hide_banner -loglevel error -i tiens.mp3 -i tenez.mp3 -filter_complex '[0:a]aresample=24000,aformat=channel_layouts=mono,apad=pad_dur=0.25[a];[1:a]aresample=24000,aformat=channel_layouts=mono[b];[a][b]concat=n=2:v=0:a=1[out]' -map '[out]' -codec:a libmp3lame -b:a 96k tiens-tenez-v1.mp3
          ffprobe -v error -show_entries format=duration,size -of json tiens-tenez-v1.mp3 > probe.json
          sha256sum tiens-tenez-v1.mp3 > sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: yo-quebec-recording-repair
          path: /tmp/yo-repair
          retention-days: 7
