name: Yo dialog contrast live verification
on:
  push:
    branches: [qa/yo-dialog-contrast-live-20261107]
    paths: [.github/workflows/yo-dialog-contrast-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    env:
      YO_QA_DIR: /tmp/yo-dialog-live
      YO_BASE_URL: https://pratiqo-hd78l7y7s-marcandretheberge-dotcoms-projects.vercel.app
      YO_LOCALES: fr
      YO_ENGINES: chromium,webkit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d094347309ed020aea7751f1b15d431296a3ceb4
          persist-credentials: false
      - name: Exact reviewed source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d094347309ed020aea7751f1b15d431296a3ceb4
          test "$(git hash-object app/globals.css)" = 15c4b318d7f74a39f1d9e360dfeff428164e1c69
          mkdir -p "$YO_QA_DIR"
          git rev-parse HEAD > "$YO_QA_DIR/commit.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Real deployed dialogs, light and dark, two units
        run: |
          set -euo pipefail
          python tests/yo/yopratiqoDialogContrast.browser.py 2>&1 | tee "$YO_QA_DIR/live.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yo-dialog-contrast-live
          path: /tmp/yo-dialog-live
          retention-days: 7
