name: Yo release safety
on:
  push:
    branches: [feat/yo-shared-language-start-20261107]
  pull_request:
    paths: [lib/yo/shared/releaseChoices.ts, components/yo/shared/IntroWelcome.tsx, components/yo/shared/IntroAudio.tsx, tests/yo/yopratiqoReleaseChoices.test.tsx]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pace selection and Mandarin fallback regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/yo-release-safety
          node --import tsx tests/yo/yopratiqoReleaseChoices.test.tsx 2>&1 | tee /tmp/yo-release-safety/checks.log
          npx eslint lib/yo/shared/releaseChoices.ts components/yo/shared/IntroWelcome.tsx components/yo/shared/IntroAudio.tsx
          git rev-parse HEAD > /tmp/yo-release-safety/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yo-release-safety
          path: /tmp/yo-release-safety
          retention-days: 7
