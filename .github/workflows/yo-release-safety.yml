name: Yo release safety
on:
  push:
    branches: [feat/yo-shared-language-start-20261107]
  pull_request:
    paths: [.github/workflows/yo-release-safety.yml, lib/yo/shared/releaseChoices.ts, components/yo/shared/IntroWelcome.tsx, components/yo/shared/IntroAudio.tsx, components/yo/learning/LessonLink.tsx, components/yo/italian/guided/GuidedItalianCourse.tsx, tests/yo/yopratiqoReleaseChoices.test.tsx, tests/yo/yopratiqoLessonLink.test.tsx]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pace, Mandarin voice and on-demand navigation regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/yo-release-safety
          node --import tsx tests/yo/yopratiqoReleaseChoices.test.tsx 2>&1 | tee /tmp/yo-release-safety/checks.log
          node --import tsx tests/yo/yopratiqoLessonLink.test.tsx
          npx eslint lib/yo/shared/releaseChoices.ts components/yo/shared/IntroWelcome.tsx components/yo/shared/IntroAudio.tsx components/yo/learning/LessonLink.tsx components/yo/italian/guided/GuidedItalianCourse.tsx
          # Interest editions retain exact historical identities in the catalog.
          # Verify the existing parser/reset/merge contract instead of freezing its source.
          node --import tsx tests/yo/yopratiqoItalianCourseProgress.test.ts
          # Verified XP adds bounded answer IDs to resumable drafts; exercise the
          # legacy parser and actual resume behavior instead of freezing this file.
          node --import tsx tests/yo/yopratiqoGuidedItalian.test.ts
          node --import tsx tests/yo/yopratiqoGuidedItalianPlayer.test.tsx
          # Interest metadata intentionally extends both profile parsers; preserve old saved evidence behavior.
          node --import tsx tests/yo/yopratiqoInterestPractice.test.tsx
          node --import tsx tests/yo/yopratiqoPersonalizedItalianPlayer.test.tsx
          node --import tsx tests/yo/yopratiqoPronunciationSession.test.tsx
          node --import tsx tests/yo/yopratiqoFeedback.test.tsx
          git rev-parse HEAD > /tmp/yo-release-safety/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yo-release-safety
          path: /tmp/yo-release-safety
          retention-days: 7
