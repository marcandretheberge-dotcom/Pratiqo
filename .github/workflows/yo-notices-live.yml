name: Yo notices live verification
on:
  push:
    branches: [qa/yo-notices-live-20261107]
    paths: [.github/workflows/yo-notices-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YO_BASE_URL: https://pratiqo-qcsyfaiue-marcandretheberge-dotcoms-projects.vercel.app
      YO_REVIEWED_SHA: d4d70c1524d615d280c7270f95168ce461cc4675
      YO_REVIEWED_TREE: e543fc60e4f455ba8f2fcd566af3af551e16da8a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable reviewed source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/yo-notices-live
          test "$(git rev-parse "${YO_REVIEWED_SHA}^{tree}")" = "$YO_REVIEWED_TREE"
          git rev-parse "${YO_REVIEWED_SHA}^{tree}" > /tmp/yo-notices-live/source-tree.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real browser, no audio fixtures or policy bypass
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_yo_notices_live.py 2>&1 | tee /tmp/yo-notices-live/result.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yo-notices-live
          path: /tmp/yo-notices-live
          retention-days: 7
