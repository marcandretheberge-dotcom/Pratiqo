name: Yo multilingual release verification
on:
  push:
    branches: [qa/yo-multilingual-release-20261108]
    paths: [.github/workflows/yo-multilingual-release.yml]
permissions:
  contents: read
jobs:
  live:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        language: [anglais, francais-quebec, espagnol, allemand, portugais-bresil, japonais, mandarin, italien]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YO_URL: https://pratiqo-2vgv9rpmq-marcandretheberge-dotcoms-projects.vercel.app
      YO_LANGUAGE: ${{ matrix.language }}
      YO_PRODUCT: 51314ba59b25f61a14b709045e5f335e08d8ead1
      YO_QA_DIR: /tmp/yo-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact reviewed product source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$YO_PRODUCT" HEAD -- app components lib public package.json package-lock.json
          mkdir -p "$YO_QA_DIR"
          echo "$YO_PRODUCT" > "$YO_QA_DIR/product-commit.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit > /tmp/browser-install.log 2>&1
      - name: Real browser entry, images, names, bank and resume
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/check-release.py <<'PY'
          import os,json,re,time,traceback
          from pathlib import Path
          from playwright.sync_api import sync_playwright, TimeoutError
          out=Path(os.environ['YO_QA_DIR']);out.mkdir(exist_ok=True)
          slug=os.environ['YO_LANGUAGE'];base=os.environ['YO_URL'];italian=slug=='italien'
          course=None if italian else json.loads(Path(f'lib/yo/shared/content/{slug}.json').read_text())
          labels={
            'fr':('Je pars de zéro','Voyager','Continuer','Commencer ici','Commencer ma mission','Quatre images','Vérifier','Carnet de mots','Fermer','Quitter et garder ma place'),
            'en':('I’m starting from zero','Travel','Continue','Start here','Start my mission','Four images','Check','Word notebook','Close','Leave and save my place'),
            'es':('Empiezo de cero','Viajar','Continuar','Empezar aquí','Empezar mi misión','Cuatro imágenes','Comprobar','Cuaderno de palabras','Cerrar','Salir y guardar mi lugar')}
          results=[]
          def notices(p):
            banner=p.get_by_test_id('cookie-consent-banner')
            if banner.is_visible():banner.get_by_role('button',name=re.compile('Necessary only|Nécessaires seulement|Nécessaires uniquement|Solo necesarias',re.I)).click()
            later=p.get_by_role('button',name=re.compile('^(Not now|Pas maintenant|Ahora no)$'))
            if later.count() and later.first.is_visible():later.first.click()
          with sync_playwright() as pw:
            for engine in ['chromium','webkit']:
              browser=getattr(pw,engine).launch()
              for locale,labels_ in labels.items():
                zero,goal,nxt,start,begin,images,check,notebook,close,leave=labels_
                ctx=browser.new_context(viewport={'width':390,'height':844},has_touch=True,is_mobile=True,reduced_motion='reduce')
                page=ctx.new_page();page.set_default_timeout(15000);page.set_default_navigation_timeout(30000)
                errors=[];console=[];failed=[];page.on('pageerror',lambda e:errors.append(str(e)));page.on('console',lambda m:console.append(m.text) if m.type=='error' else None)
                page.on('requestfailed',lambda r:failed.append({'url':r.url,'failure':r.failure}))
                name=f'{slug}-{locale}-{engine}';t=time.monotonic()
                try:
                  route=f'/yo/langues/{slug}/'+('parcours' if italian else 'demarrer')
                  r=page.goto(base+route+'?lang='+locale,wait_until='domcontentloaded');assert r and r.status==200
                  welcome=page.locator('[data-yoppo-onboarding]' if italian else '[data-shared-welcome]');welcome.wait_for()
                  try:page.get_by_test_id('cookie-consent-banner').wait_for(timeout=4000)
                  except TimeoutError:pass
                  notices(page)
                  if italian:
                    candidates={'fr':['Je pars de zéro'],'en':['I’m starting from zero','I’m a beginner','I’m starting from scratch'],'es':['Empiezo de cero']}[locale]
                    names=welcome.get_by_role('button').all_text_contents();selected=next((x for x in candidates if x in names),None)
                    if selected is None:raise AssertionError('Italian experience labels: '+repr(names))
                    welcome.get_by_role('button',name=selected,exact=True).click();notices(page)
                    welcome.get_by_role('button',name=re.compile('^(Voyager|Travel|Viajar)$')).click()
                    radios=welcome.locator('input[type=radio]');radios.first.wait_for(state='attached')
                    choice=radios.locator('xpath=..').filter(has_text=re.compile('2\s*h')).first
                    if choice.count()==0:choice=radios.nth(2).locator('xpath=..')
                    choice.tap();assert welcome.locator('input[type=radio]:checked').count()==1
                    welcome.get_by_role('button',name=nxt,exact=True).click()
                    page.screenshot(path=str(out/f'{name}-recommendation.png'),full_page=True)
                    welcome.get_by_role('button',name=start,exact=True).click();page.locator('[data-guided-italian]').wait_for()
                    page.reload(wait_until='domcontentloaded');page.locator('[data-guided-italian]').wait_for();assert page.locator('[data-yoppo-onboarding]').count()==0
                  else:
                    welcome.get_by_role('button',name=zero,exact=True).click();notices(page)
                    welcome.get_by_role('button',name=goal,exact=True).click();assert welcome.get_by_role('button',name=nxt,exact=True).is_disabled()
                    page.locator('[data-shared-pace="120"]').tap();assert page.locator('input[type=radio][value="120"]').is_checked()
                    welcome.get_by_role('button',name=nxt,exact=True).click();assert page.get_by_role('combobox').count()==0
                    page.screenshot(path=str(out/f'{name}-recommendation.png'),full_page=True)
                    welcome.get_by_role('button',name=start,exact=True).click();page.locator('[data-shared-course]').wait_for()
                    p=page.evaluate('(k)=>JSON.parse(localStorage.getItem(k)).profile','yo.shared-intro.v1.'+course['language']);assert p['minutes']==120
                    page.get_by_role('button',name=notebook,exact=True).click();d=page.get_by_role('dialog');d.wait_for()
                    target=next(p[1] for p in course['phrases'] if p[0]=='name');assert d.get_by_text(target,exact=True).count()==1
                    d.get_by_role('button',name=close,exact=True).click()
                    page.get_by_role('button',name=begin,exact=True).click();g=page.get_by_role('group',name=images,exact=True);g.wait_for();assert g.locator('button').count()==4
                    for im in g.locator('img').all():page.wait_for_function('(i)=>i.complete&&i.naturalWidth>0',arg=im.element_handle())
                    answer=course['names'][0]['alt'][locale];g.get_by_role('button',name=answer,exact=True).tap();page.get_by_role('button',name=check,exact=True).click()
                    assert page.get_by_role('button',name=nxt,exact=True).is_enabled();page.screenshot(path=str(out/f'{name}-images.png'),full_page=True)
                    page.get_by_role('button',name=leave,exact=True).click();page.reload(wait_until='domcontentloaded');page.locator('[data-shared-course]').wait_for()
                    page.get_by_role('button',name=begin,exact=True).click();assert page.get_by_role('button',name=nxt,exact=True).is_enabled()
                    assert page.get_by_role('button',name=answer,exact=True).get_attribute('aria-pressed')=='true'
                  for width in [320,390,1280]:
                    page.set_viewport_size({'width':width,'height':844});assert page.evaluate('document.documentElement.scrollWidth<=innerWidth'),f'overflow at {width}'
                  bankpath=f'/yo/langues/{slug}/'+('parcours/u01/vocabulaire' if italian else 'demarrer/vocabulaire')
                  if italian:
                    # Exercise the real new-tab bank link, not just a direct GET.
                    with ctx.expect_page() as opened:page.locator('a[href*="/u01/vocabulaire"]').first.click()
                    bank=opened.value;bank.set_default_timeout(15000);bank.wait_for_load_state('domcontentloaded');assert bankpath in bank.url
                    bank.locator('table').first.wait_for()
                    # Verify the actual catalogue navigation with no prefetch-policy bypass.
                    page.locator('a[href^="/yo/langues"]').filter(has_text='YoPratiqo').first.click()
                    page.wait_for_url(re.compile(r'/yo/langues(?:\?|$)'));page.get_by_test_id('yo-language-quick-start').wait_for()
                  else:
                    r=page.goto(base+bankpath+'?lang='+locale,wait_until='domcontentloaded');assert r and r.status==200
                    page.locator('[data-shared-print]').wait_for();rows=page.locator('tbody tr')
                    assert rows.count()==len(course['phrases'])+len(course['glossary']), 'bank row coverage'
                    # Match the target column only. The translation may deliberately be identical,
                    # and Japanese/Mandarin put reading aids inside the same target cell.
                    for i,phrase in enumerate(course['phrases']):
                      cell=rows.nth(i).locator('td').nth(0)
                      direct=cell.evaluate('(e)=>Array.from(e.childNodes).filter(n=>n.nodeType===Node.TEXT_NODE).map(n=>n.textContent).join("").trim()')
                      assert direct==phrase[1],f'target phrase {i}: {direct!r}'
                      assert rows.nth(i).locator('td').nth(1).inner_text().strip()==phrase[2][locale],f'translation {i}'
                      if phrase[3]:assert cell.locator('span').inner_text().strip()==phrase[3],f'reading {i}'
                  assert not errors,errors
                  results.append({'case':name,'passed':True,'seconds':round(time.monotonic()-t,2),'consoleErrors':console,'failedRequests':failed})
                  print('PASS '+name,flush=True)
                except Exception as e:
                  trace=traceback.format_exc();results.append({'case':name,'passed':False,'error':str(e),'traceback':trace,'pageErrors':errors,'consoleErrors':console,'failedRequests':failed})
                  try:page.screenshot(path=str(out/f'{name}-failure.png'),full_page=True);(out/f'{name}-failure.txt').write_text(page.locator('body').inner_text())
                  except Exception:pass
                  print('FAIL '+name+': '+trace,flush=True)
                finally:
                  (out/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2));ctx.close()
              browser.close()
          if not all(r['passed'] for r in results) or len(results)!=6:raise SystemExit(1)
          print('All six real entry/resume cases passed. Device-voice pronunciation and physical-device playback are not certified by these interaction checks.',flush=True)
          PY
          python -u /tmp/check-release.py 2>&1 | tee "$YO_QA_DIR/live.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yo-release-${{ matrix.language }}
          path: /tmp/yo-release
          retention-days: 7
