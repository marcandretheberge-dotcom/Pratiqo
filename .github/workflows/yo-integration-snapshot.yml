name: Yo integration source snapshot
on:
  push:
    branches: [feat/yo-guided-italian-20261106]
    paths: [.github/workflows/yo-integration-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD | gzip > /tmp/yo-integration-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: yo-integration-source
          path: /tmp/yo-integration-source.tar.gz
          retention-days: 1
