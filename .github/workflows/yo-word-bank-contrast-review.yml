name: Yo vocabulary contrast and print review

on:
  pull_request:
    paths:
      - ".github/workflows/yo-word-bank-contrast-review.yml"
      - "app/yo/langues/italien/parcours/**/vocabulaire/page.tsx"
      - "app/yo/langues/[language]/demarrer/vocabulaire/page.tsx"
      - "tests/yo/yopratiqoWordBankDarkMode.test.tsx"
  push:
    branches:
      - "fix/yoppo-wordbank-dark-mobile-20261109"

permissions:
  contents: read

concurrency:
  group: yo-word-bank-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contrast-print:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and focused lint
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npx eslint 'app/yo/langues/italien/parcours/[unitId]/vocabulaire/page.tsx' 'app/yo/langues/[language]/demarrer/vocabulaire/page.tsx' tests/yo/yopratiqoWordBankDarkMode.test.tsx
          git diff --check
      - name: Verify dark-mode contrast, responsive table and printable markup
        run: node --import tsx tests/yo/yopratiqoWordBankDarkMode.test.tsx
      - name: Preserve other course printables and Italian learning
        run: |
          set -euo pipefail
          node --import tsx tests/yo/yopratiqoPrintPageShell.test.ts
          node --import tsx tests/yo/yopratiqoPrintableResourceRoutes.test.ts
          npm run test:yo-italian-course
