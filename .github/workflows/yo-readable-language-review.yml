name: Yo readable language review
on:
  push:
    branches: [fix/yo-readable-language-20261107]
permissions:
  contents: read
concurrency:
  group: yo-readable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      YO_QA_DIR: /tmp/yo-readable-review
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exact source, types and lint
        run: |
          set -euo pipefail
          test "$(git hash-object components/yo/italian/guided/GuidedItalianCourse.tsx)" = 23eddc76a23d20c3c4f6893cd7d5484c17dbb1cb
          test "$(git hash-object components/yo/learning/LanguageExplanation.tsx)" = f007493e2f1ba3294644fdec375f4397e9d30deb
          test "$(git hash-object lib/yo/pedagogy/firstMeetingGrammar.ts)" = 787a7e73009e9f64cb88a791676f0cdd37567fc4
          test "$(git hash-object tests/yo/yopratiqoReadableLanguage.test.tsx)" = b87e6eafc605851d3b4ea26ba45d6d0d450ab73b
          npx tsc --noEmit
          npx eslint components/yo/personalized/ItalianOnboarding.tsx components/yo/learning/LanguageExplanation.tsx lib/yo/pedagogy/firstMeetingGrammar.ts tests/yo/yopratiqoReadableLanguage.test.tsx components/yo/italian/guided/GuidedItalianCourse.tsx
          git diff --check 030ef52a021a5ba53ff5998451d7cbd7c2d1bbff
      - name: Teaching, player and regression checks
        run: |
          set -euo pipefail
          node --import tsx tests/yo/yopratiqoEasyOnboarding.test.tsx
          node --import tsx tests/yo/yopratiqoReadableLanguage.test.tsx
          node --import tsx tests/yo/yopratiqoApprovedArtwork.test.tsx
          node --import tsx tests/yo/yopratiqoFeedback.test.tsx
          node --import tsx tests/yo/yopratiqoInterfaceNotices.test.tsx
          node --import tsx tests/yo/yopratiqoGuidedItalian.test.ts
          node --import tsx tests/yo/yopratiqoGuidedItalianPlayer.test.tsx
          node --import tsx tests/yo/yopratiqoPersonalizedItalian.test.ts
          node --import tsx tests/yo/yopratiqoPersonalizedItalianPlayer.test.tsx
          npm run test:launch-critical
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Actual component walkthrough
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://audio.example.test
        run: |
          set -euo pipefail
          node --import tsx scripts/prepare_yo_personalized_review.ts
          ./node_modules/.bin/next dev .qa-guided --webpack -p 3129 > "$YO_QA_DIR/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3129/yo/langues/italien/parcours?lang=fr >/dev/null; then break; fi
            sleep 2
          done
          python tests/yo/yopratiqoEasyOnboarding.browser.py 2>&1 | tee "$YO_QA_DIR/onboarding.log"
          python tests/yo/yopratiqoReadableLanguage.browser.py 2>&1 | tee "$YO_QA_DIR/grammar.log"
          python tests/yo/yopratiqoPersonalizedItalian.browser.py 2>&1 | tee "$YO_QA_DIR/course.log"
      - name: Source identity
        if: always()
        run: |
          mkdir -p "$YO_QA_DIR"
          git rev-parse HEAD > "$YO_QA_DIR/commit.txt"
          git ls-files -s components/yo/personalized/ItalianOnboarding.tsx tests/yo/yopratiqoEasyOnboarding* components/yo/learning lib/yo/pedagogy components/yo/italian/guided/GuidedItalianCourse.tsx > "$YO_QA_DIR/source.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yo-readable-language-review
          path: /tmp/yo-readable-review
          retention-days: 7
