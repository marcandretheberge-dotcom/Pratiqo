name: Japanese foundations merge QA

on:
  push:
    branches:
      - "feat/yopratiqo-japanese-foundations-20261030"
    paths:
      - ".github/workflows/japanese-foundations-merge-qa.yml"
      - "app/yo/langues/**"
      - "components/yo/**"
      - "lib/yo/**"
      - "scripts/generate-yopratiqo-audio.ts"
      - "tests/yo/**"
      - "package.json"
      - ".gitignore"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.13.0"
          package-manager-cache: false
      - run: npm ci
      - name: Japanese foundations
        run: npm run test:yo-japanese-foundations
      - name: Italian regression
        run: npm run test:yo-italian
      - name: Shared YoPratiqo audio
        run: npm run test:yo-audio
      - name: Language landing and navigation
        run: npm run test:yo-landing-pages && npm run test:yo-languages && npm run test:yo-course-navigation
