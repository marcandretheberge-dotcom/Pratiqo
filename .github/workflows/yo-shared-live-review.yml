name: Yo shared language live review
on:
  push:
    branches: [qa/yo-shared-language-live-20261107]
    paths: [.github/workflows/yo-shared-live-review.yml, tests/yo/yopratiqoSharedIntroLive.browser.py]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      YO_QA_DIR: /tmp/yo-shared-live
      YO_SHARED_URL: https://pratiqo-faj66s4mc-marcandretheberge-dotcoms-projects.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reviewed product identity
        run: |
          set -euo pipefail
          git diff --exit-code b8ed98adf32d0ef601a9715c213001b2395f1fff HEAD -- app components lib public package.json package-lock.json
          mkdir -p "$YO_QA_DIR"
          git rev-parse HEAD > "$YO_QA_DIR/qa-commit.txt"
          echo b8ed98adf32d0ef601a9715c213001b2395f1fff > "$YO_QA_DIR/product-commit.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Real immutable preview, no media fixtures
        run: |
          set -euo pipefail
          python tests/yo/yopratiqoSharedIntroLive.browser.py 2>&1 | tee "$YO_QA_DIR/live.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yo-shared-language-live
          path: /tmp/yo-shared-live
          retention-days: 7
