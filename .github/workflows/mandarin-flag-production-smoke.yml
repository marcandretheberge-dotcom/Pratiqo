name: Mandarin flag production smoke

on:
  push:
    branches: ["qa/yopratiqo-mandarin-flag-production-20261103"]
    paths: [".github/workflows/mandarin-flag-production-smoke.yml"]

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live public catalog in three languages
        shell: python
        run: |
          import json, re, time, urllib.request
          from pathlib import Path
          from html.parser import HTMLParser

          origin = 'https://www.pratiqo.ca'
          root = Path('flag-smoke')
          root.mkdir(exist_ok=True)

          def get(path):
              request = urllib.request.Request(origin + path, headers={'User-Agent': 'Pratiqo-Release-Smoke/1.0', 'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(request, timeout=35) as response:
                  assert response.status == 200
                  assert response.url.startswith(origin + '/'), response.url
                  return response.read().decode('utf-8')

          class Flag(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.depth = 0
                  self.results = []
                  self.current = None
                  self.ids = []
              def handle_starttag(self, tag, values):
                  a = dict(values)
                  if tag == 'span' and a.get('data-yo-language-badge'):
                      self.ids.append(a['data-yo-language-badge'])
                  if tag == 'span' and a.get('data-yo-language-badge') == 'zh':
                      self.depth = 1
                      self.current = {'role': a.get('role'), 'label': a.get('aria-label'), 'polygons': 0, 'externalImages': 0, 'viewBox': None, 'fills': []}
                  elif self.current and tag == 'span':
                      self.depth += 1
                  if self.current:
                      if tag == 'polygon':
                          self.current['polygons'] += 1
                          assert len(a.get('points', '').split()) == 10
                      if tag in ('img', 'image'):
                          self.current['externalImages'] += 1
                      if tag == 'svg':
                          self.current['viewBox'] = a.get('viewbox')
                      if a.get('fill'):
                          self.current['fills'].append(a['fill'])
              def handle_endtag(self, tag):
                  if self.current and tag == 'span':
                      self.depth -= 1
                      if not self.depth:
                          self.results.append(self.current)
                          self.current = None

          # Observe the new release within this job. Only anonymous GET requests.
          for attempt in range(16):
              html = get('/yo/langues')
              if 'data-yo-language-badge="zh"' in html:
                  break
              if attempt == 15:
                  raise AssertionError('Chinese flag was not found on production within the verification window')
              print('Previous production version still visible; retrying public catalog.', flush=True)
              time.sleep(15)

          report = []
          for route in ('/yo', '/yo/langues'):
              for locale, suffix, label in [('fr', '', 'Chine'), ('en', '?lang=en', 'China'), ('es', '?lang=es', 'China')]:
                  path = route + suffix
                  html = get(path)
                  parser = Flag()
                  parser.feed(html)
                  assert parser.results, f'No zh badge on {path}'
                  for flag in parser.results:
                      assert flag['role'] == 'img'
                      assert flag['label'] == label, (path, flag)
                      assert flag['polygons'] == 5
                      assert flag['externalImages'] == 0
                      assert flag['viewBox'] == '0 0 30 20'
                      assert '#DE2910' in flag['fills'] and '#FFDE00' in flag['fills']
                  for existing in ['es', 'fr-ca', 'en', 'ja', 'it', 'de', 'pt-br']:
                      assert existing in parser.ids, (path, existing)
                  assert '/yo/langues/mandarin/parcours' in html
                  record = {'path': path, 'http': 200, 'flags': parser.ids, 'chineseFlag': parser.results, 'result': 'PASS'}
                  report.append(record)
                  print(json.dumps(record, ensure_ascii=False), flush=True)
          Path('flag-smoke/public-report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')

      - name: Render production catalog in Chrome desktop and mobile-sized viewports
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Browser unavailable; HTTP and SVG checks only." > flag-smoke/browser-status.txt
            exit 0
          fi
          "$CHROME" --version > flag-smoke/browser-status.txt
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=390,1800 --virtual-time-budget=15000 --screenshot="$PWD/flag-smoke/catalog-mobile.png" --dump-dom https://www.pratiqo.ca/yo/langues > flag-smoke/mobile-dom.html 2> flag-smoke/chrome-mobile.log
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=1365,1400 --virtual-time-budget=15000 --screenshot="$PWD/flag-smoke/catalog-desktop.png" --dump-dom https://www.pratiqo.ca/yo/langues > flag-smoke/desktop-dom.html 2> flag-smoke/chrome-desktop.log
          python3 - <<'PY'
          from pathlib import Path
          for mode in ['mobile', 'desktop']:
              html = Path('flag-smoke/' + mode + '-dom.html').read_text()
              assert 'data-yo-language-badge="zh"' in html, mode
              assert '/yo/langues/mandarin/parcours' in html, mode
              png = Path('flag-smoke/catalog-' + mode + '.png')
              assert png.read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
              print('PASS browser DOM and screenshot: ' + mode)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mandarin-flag-production-smoke
          path: flag-smoke/
          retention-days: 7
          if-no-files-found: error
