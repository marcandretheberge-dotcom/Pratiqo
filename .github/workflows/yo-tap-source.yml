name: Yo tap source
on:
  push:
    branches: [feat/yo-tap-flow-20261108]
    paths: [.github/workflows/yo-tap-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD | gzip > /tmp/yo-tap-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: yo-tap-source
          path: /tmp/yo-tap-source.tar.gz
          retention-days: 1
